<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Scouting Sprocket</title>
	<link rel="stylesheet" href="https://8bitadam.github.io/SnorpCSS/css.min/flexi.css">

	<style>
	
	* {
    box-sizing: border-box;
    background-color: #B98942;
	}
	.hamburger {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
    padding: 0 20px 0 16px;
    border: 5px solid #B98942;
    border-radius: 16px;
    background-color: #D4CEB1;
    color: #61382D;
    font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
	}
	.hamburger .bars {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 26px;
    background-color: transparent;
	}
	.hamburger .bars span {
    display: block;
    height: 4px;
    border-radius: 2px;
    background-color: #61382D;
    transition: background-color 0.15s ease;
	}
	.hamburger .label { background-color: transparent; }
	.hamburger:active {
    background-color: #380372;
    border-color: #380372;
    color: #FEFEFE;
    transform: scale(0.96);
	}
	.hamburger:active .bars span { background-color: #FEFEFE; }
	.hamburger:focus-visible,
	.menu a:focus-visible,
	.menu-close:focus-visible {
    outline: 3px solid #380372;
    outline-offset: 3px;
	}
	.backdrop {
    position: fixed;
    inset: 0;
    z-index: 9;
    background-color: rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
	}
	.backdrop.open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease, visibility 0s;
	}
	html.menu-open { overflow: hidden; }
	@media (prefers-reduced-motion: reduce) {
    .hamburger, .hamburger .bars span, .menu, .backdrop { transition: none; }
	}
	.menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 33.333vw;
    min-width: 220px;
    height: 100vh;
    padding: 20px;
    border-right: 5px solid #B98942;
    background-color: #D4CEB1;
    overflow-y: auto;
    z-index: 10;
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.3s ease, visibility 0s linear 0.3s;
	}
	.menu.open {
    transform: translateX(0);
    visibility: visible;
    transition: transform 0.3s ease, visibility 0s;
	}
	.menu a {
    display: block;
    padding: 14px 20px;
    margin-bottom: 12px;
    border: 5px solid #B98942;
    border-radius: 16px;
    background-color: #D4CEB1;
    color: #3F4534;
    font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;
	}
	.menu a:hover { background-color: #B98942; }
	.menu a.active {
    background-color: #380372;
    border-color: #380372;
    color: #FEFEFE;
	}
	.menu-close {
    display: block;
    min-width: 48px;
    min-height: 48px;
    margin: 0 0 16px auto;
    border: none;
    background-color: transparent;
    color: #61382D;
    font-size: 28px;
    cursor: pointer;
	}
	.frame {
    position: relative;
    isolation: isolate;          /* keeps the ::before behind content but above the background */
    border-radius: 16px;
    background-color: #D4CEB1;
    border: 5px solid #FEFEFE;
    padding: 20px;
    width: calc(100% - 192px);
    margin: 96px;
	}
	
	.frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background-image: url("concrete-texture-cleaned.jpg");
    background-size: cover;
    opacity: .1;
	}
	.element{
    border-radius: 16px;
    background-color: #D4CEB1;
    opacity: 75%;
    border: 5px solid #B98942;
    padding: 20px;
    width: fit-content;
    margin: 96px;
    display: block; 
	margin: auto; 
	margin-bottom: 3em;
	}
	@font-face {
    font-family: 'Nunito';
    src: url('Fonts/Nunito.ttf') format('truetype');
    font-weight: 200 1000;
    font-style: normal;
    font-display: swap;
	}
	@font-face {
    font-family: 'Anta';
    src: url('Fonts/Anta.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
	}
	@font-face {
    font-family: 'OpenDyslexic';
    src: url('Fonts/OpenDyslexic.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
	}
	
	p {
  font-size: 24px;
  font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
  font-weight: bold;
  color: #3F4534;
  background-color: transparent;
	}
	
	h1 {
    font-size: 36px;
    font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
    color: #61382D;
    background-color: transparent;
    margin-bottom: 5px;
	}
	
	h2 {
  font-size: 36px;
  font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
  color: #7A4B3A;
  background-color: transparent;
	}
	
	h3 {
  font-size: 28px;
  font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
  color: #5A6446;
  background-color: transparent;
	}
	h4{
	font-size: 12px;
  font-family: 'Nunito', 'Comic Sans MS', Arial, Helvetica, sans-serif;
  color: #5A6446;
  background-color: transparent;
	}
	.center {
	text-align: center;
	}
	
	img {
	display: block; 
	margin: auto; 
	background-color: transparent;
	}
	.head {
    display: block;
    background-color: transparent;
	}
	
	.underline {
    width: 100%;
    height: 10px;
    background-color: #380372;
    margin-bottom: 20px;
	}
	.button 
	{
	border-radius: 16px;
    background-color: rgba(56, 3, 114, .5);
    opacity: 75%;
    border: 5px solid rgba(56, 3, 114, 1);
    padding: 20px;
    width: fit-content;
    margin: 96px;
    display: block; 
margin: auto; 
margin-bottom: 3em;

	}
	.button-alert 
	{
	border-radius: 16px;
    background-color: rgba(166, 75, 50, .5);
    opacity: 75%;
    border: 5px solid rgba(166, 75, 50, 1);
    padding: 20px;
    width: fit-content;
    margin: 96px;
    display: block; 
margin: auto; 
margin-bottom: 3em;

	}
	.row {
	background-color: transparent;
	}
	</style>
</head>
<body>
    <div class="frame">
        <button class="hamburger" id="menu-toggle" aria-expanded="false" aria-controls="menu">
            <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="label">Menu</span>
        </button>
        <div class="backdrop" id="backdrop"></div>
        <nav class="menu" id="menu" aria-label="Main">
            <button class="menu-close" aria-label="Close menu">✕</button>
            <a href="#" class="active" aria-current="page">Home</a>
            <a href="#">About</a>
            <a href="#">Demo Data</a>
        </nav>
        <img src="./sprocket-eye-pie-math.png" alt="Scouting Sprocket logo" width="300">
        <div class="element">
            <div class="head">
                <h1>Scouting Sprocket</h1>
                <div class="underline"></div>
                <p class="center">Open Core - Visual Demo</p>
                <h4 class="center">Version 1.17 Visual Demo</h4>
            </div>
        </div>
        <div class="element">
            <div class="head">
                <h1>Load Demo Data</h1>
                <div class="underline"></div>
                <div class="row">
                    <div class="col-1 button" style="margin-right: 1em;">One part</div>
                   <div class="col-1 button-alert">One part</div>
                </div>
            </div>
        </div>
    </div>
    
	
    <script>
    (function () {
        var toggle = document.getElementById('menu-toggle');
        var menu = document.getElementById('menu');
        var backdrop = document.getElementById('backdrop');
        var closeBtn = menu.querySelector('.menu-close');

        function setOpen(open) {
            menu.classList.toggle('open', open);
            backdrop.classList.toggle('open', open);
            document.documentElement.classList.toggle('menu-open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            (open ? closeBtn : toggle).focus();
        }

        toggle.addEventListener('click', function () { setOpen(true); });
        closeBtn.addEventListener('click', function () { setOpen(false); });
        backdrop.addEventListener('click', function () { setOpen(false); });
        menu.addEventListener('click', function (e) {
            if (e.target.closest('a')) setOpen(false);
        });

        document.addEventListener('keydown', function (e) {
            if (!menu.classList.contains('open')) return;
            if (e.key === 'Escape') { setOpen(false); return; }
            if (e.key !== 'Tab') return;
            var items = menu.querySelectorAll('a, button');
            var first = items[0], last = items[items.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
    })();
    </script>
</body>
</html>
