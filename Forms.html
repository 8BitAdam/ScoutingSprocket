<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting Sprocket — Forms</title>
    <style>
        :root {
            color-scheme: light;
            --sidebar-width: 250px;
            --background: #d4ceb1;
            --sidebar: #ba8a43;
            --surface: #f1e4c4;
            --surface-raised: #fdf6e3;
            --outline: #fdf6e3;
            --text: #ba8a43;
            --muted: #3f4534;
            --accent: #380372;
            --danger: #8d2929;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: var(--surface-raised);
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: .7;
        }

        input, select, textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--muted);
            border-radius: 7px;
            background: var(--surface-raised);
            color: var(--muted);
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            min-height: auto;
            accent-color: var(--accent);
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            padding: 28px 16px;
            background: var(--sidebar);
            border-right: 1px solid var(--outline);
        }

        .brand {
            display: block;
            margin: 0 12px 32px;
            color: var(--surface);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-decoration: none;
        }

        .brand span {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: .72rem;
            font-weight: 400;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .nav-list {
            display: grid;
            gap: 6px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-link {
            display: block;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
        }

        .nav-link:hover,
        .nav-link:focus-visible,
        .nav-link.active {
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .nav-link.active {
            box-shadow: inset 3px 0 var(--accent);
        }

        .content {
            flex: 1;
            min-width: 0;
            padding: 48px;
        }

        .form-shell {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-shell h1 {
            margin: 0 0 6px;
        }

        .intro,
        .status {
            color: var(--muted);
        }

        .intro {
            margin: 0 0 22px;
        }

        .panel {
            padding: clamp(16px, 3vw, 26px);
            border: 1px solid var(--outline);
            border-radius: 14px;
            background: var(--surface);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            background: transparent;
            color: var(--accent);
        }

        .tab.active {
            background: var(--accent);
            color: var(--surface-raised);
        }

        .question {
            margin: 0 0 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--outline);
        }

        .question:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: 0;
        }

        .question legend,
        .question-label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        .choice-list {
            display: grid;
            gap: 8px;
        }

        .choice {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .grid-scroll {
            overflow-x: auto;
        }

        .answer-grid {
            width: 100%;
            border-collapse: collapse;
            color: var(--muted);
        }

        .answer-grid th,
        .answer-grid td {
            padding: 8px;
            border: 1px solid var(--outline);
            text-align: center;
        }

        .answer-grid th:first-child {
            text-align: left;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .status.error {
            color: var(--danger);
        }

        @media (max-width: 640px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                padding: 20px 16px;
                border-right: 0;
                border-bottom: 1px solid var(--outline);
            }

            .brand {
                margin-bottom: 18px;
            }

            .nav-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .content {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <a class="brand" href="/">
                Scouting Sprocket
                <span>Admin View</span>
            </a>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a class="nav-link" href="/">Dashboard</a></li>
                    <li><a class="nav-link active" href="/Forms.html" aria-current="page">Forms</a></li>
                    <li><a class="nav-link" href="/Builder.html">Builder</a></li>
                    <li><a class="nav-link" href="/Export.html">Export</a></li>
                    <li><a class="nav-link" href="/Import.html">Import</a></li>
                    <li><a class="nav-link" href="/Data_actions.html">Data Actions</a></li>
                    <li><a class="nav-link" href="/Settings.html">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <div class="form-shell">
                <h1 id="formTitle">Loading form…</h1>
                <p id="formIntro" class="intro"></p>
                <p id="status" class="status" role="status" aria-live="polite"></p>
                <form id="form" class="panel" hidden>
                    <div id="tabs" class="tabs" role="tablist" aria-label="Form sections"></div>
                    <div id="section"></div>
                    <div class="actions">
                        <button id="save" type="submit">Save responses</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById("form");
        const formTitle = document.getElementById("formTitle");
        const formIntro = document.getElementById("formIntro");
        const status = document.getElementById("status");
        const tabs = document.getElementById("tabs");
        const sectionHost = document.getElementById("section");
        let definition;
        let tokenData = {};
        let responses = {};
        let activeSection = 0;

        const setStatus = (message, error = false) => {
            status.textContent = message;
            status.className = `status${error ? " error" : ""}`;
        };

        const fieldId = index => `question-${index}`;

        function makeChoiceInput(element, index, inputType) {
            const list = document.createElement("div");
            list.className = "choice-list";

            element.options.forEach((option, optionIndex) => {
                const label = document.createElement("label");
                label.className = "choice";
                const input = document.createElement("input");
                input.type = inputType;
                input.name = fieldId(index);
                input.value = option;
                input.checked = inputType === "checkbox"
                    ? Array.isArray(responses[index]) &&
                      responses[index].includes(option)
                    : responses[index] === option;
                label.append(input, document.createTextNode(option));
                list.append(label);
            });

            return list;
        }

        function makeGrid(element, index, checkbox) {
            const wrapper = document.createElement("div");
            wrapper.className = "grid-scroll";
            const table = document.createElement("table");
            table.className = "answer-grid";
            const header = document.createElement("tr");
            header.append(document.createElement("th"));

            element.columns.forEach(column => {
                const heading = document.createElement("th");
                heading.textContent = column;
                header.append(heading);
            });

            const head = document.createElement("thead");
            head.append(header);
            table.append(head);
            const body = document.createElement("tbody");
            const saved = responses[index] || {};

            element.rows.forEach(row => {
                const line = document.createElement("tr");
                const label = document.createElement("th");
                label.textContent = row;
                line.append(label);

                element.columns.forEach(column => {
                    const cell = document.createElement("td");
                    const input = document.createElement("input");
                    input.type = checkbox ? "checkbox" : "radio";
                    input.name = checkbox
                        ? `${fieldId(index)}-${row}-${column}`
                        : `${fieldId(index)}-${row}`;
                    input.value = column;
                    input.dataset.row = row;
                    input.checked = checkbox
                        ? Array.isArray(saved[row]) && saved[row].includes(column)
                        : saved[row] === column;
                    cell.append(input);
                    line.append(cell);
                });

                body.append(line);
            });

            table.append(body);
            wrapper.append(table);
            return wrapper;
        }

        function makeControl(element, index) {
            switch (element.type) {
                case "Short Answer": {
                    const input = document.createElement("input");
                    input.type = element.answerType === "number"
                        ? "number"
                        : element.answerType === "email"
                            ? "email"
                            : element.answerType === "date"
                                ? "date"
                                : "text";
                    input.name = fieldId(index);
                    input.value = responses[index] || "";
                    return input;
                }
                case "Paragraphs": {
                    const input = element.answerType === "number"
                        ? document.createElement("input")
                        : document.createElement("textarea");
                    if (input.tagName === "INPUT") input.type = "number";
                    input.name = fieldId(index);
                    input.value = responses[index] || "";
                    return input;
                }
                case "Checkboxes":
                    return makeChoiceInput(element, index, "checkbox");
                case "Dropdown": {
                    const select = document.createElement("select");
                    select.name = fieldId(index);
                    const empty = document.createElement("option");
                    empty.value = "";
                    empty.textContent = "Select an answer";
                    select.append(empty);
                    element.options.forEach(option => {
                        const item = document.createElement("option");
                        item.value = option;
                        item.textContent = option;
                        item.selected = responses[index] === option;
                        select.append(item);
                    });
                    return select;
                }
                case "Linear Scale":
                case "Rating": {
                    const select = document.createElement("select");
                    select.name = fieldId(index);
                    const empty = document.createElement("option");
                    empty.value = "";
                    empty.textContent = "Select a value";
                    select.append(empty);
                    for (let value = element.min; value <= element.max; value += 1) {
                        const option = document.createElement("option");
                        option.value = value;
                        option.textContent =
                            `${value} — ${value === element.min
                                ? element.minLabel || "Minimum"
                                : value === element.max
                                    ? element.maxLabel || "Maximum"
                                    : ""}`.replace(/ — $/, "");
                        option.selected = String(responses[index]) === String(value);
                        select.append(option);
                    }
                    return select;
                }
                case "Multiple Choice Grid":
                    return makeGrid(element, index, false);
                case "Checkbox Grid":
                    return makeGrid(element, index, true);
                default:
                    throw new Error(`Unsupported element type: ${element.type}`);
            }
        }

        function renderSection() {
            const section = definition.sections[activeSection];
            sectionHost.replaceChildren();
            const heading = document.createElement("h2");
            heading.textContent = section.title;
            sectionHost.append(heading);

            section.elements.forEach((element, index) => {
                const question = document.createElement("fieldset");
                question.className = "question";
                const legend = document.createElement("legend");
                legend.textContent = `${element.prompt} (${element.type})`;
                question.append(legend, makeControl(element, `${activeSection}-${index}`));
                sectionHost.append(question);
            });
        }

        function renderTabs() {
            tabs.replaceChildren();
            definition.sections.forEach((section, index) => {
                const tab = document.createElement("button");
                tab.type = "button";
                tab.className = `tab${index === activeSection ? " active" : ""}`;
                tab.textContent = section.title;
                tab.setAttribute("role", "tab");
                tab.setAttribute("aria-selected", String(index === activeSection));
                tab.addEventListener("click", () => {
                    captureSection();
                    activeSection = index;
                    renderTabs();
                    renderSection();
                });
                tabs.append(tab);
            });
        }

        function captureSection() {
            if (!definition) return;
            definition.sections[activeSection].elements.forEach((element, index) => {
                const key = `${activeSection}-${index}`;
                const controls = [...sectionHost.querySelectorAll(`[name="${CSS.escape(fieldId(key))}"]`)];

                if (element.type === "Checkboxes") {
                    responses[key] = controls.filter(control => control.checked).map(control => control.value);
                } else if (element.type === "Multiple Choice Grid" || element.type === "Checkbox Grid") {
                    const grid = {};
                    controls.forEach(control => {
                        if (!control.checked) return;
                        const row = control.dataset.row;
                        if (element.type === "Checkbox Grid") {
                            grid[row] = grid[row] || [];
                            grid[row].push(control.value);
                        } else {
                            grid[row] = control.value;
                        }
                    });
                    responses[key] = grid;
                } else {
                    responses[key] = controls[0]?.value || "";
                }
            });
        }

        async function load() {
            try {
                const tokenResponse = await fetch("/form-token", { cache: "no-store" });
                if (!tokenResponse.ok) throw new Error("No saved form was found.");
                const token = await tokenResponse.json();
                tokenData = token;
                definition = {
                    name: token.name,
                    sections: token.sections
                };
                responses = {};
                formTitle.textContent = definition.name;
                formIntro.textContent = "Complete each section, then save your responses.";
                form.hidden = false;
                renderTabs();
                renderSection();
            } catch (error) {
                formTitle.textContent = "Form unavailable";
                setStatus(error instanceof Error ? error.message : "Could not load the form.", true);
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            captureSection();
            const save = document.getElementById("save");
            save.disabled = true;
            setStatus("Saving responses…");
            try {
                const response = await fetch("/Form_response", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        ...tokenData,
                        name: definition.name,
                        sections: definition.sections,
                        responses: [
                            ...(Array.isArray(tokenData.responses)
                                ? tokenData.responses
                                : []),
                            {
                                submittedAt: new Date().toISOString(),
                                values: responses
                            }
                        ]
                    })
                });
                if (!response.ok) throw new Error(`Save failed (HTTP ${response.status}).`);
                tokenData.responses = [
                    ...(Array.isArray(tokenData.responses)
                        ? tokenData.responses
                        : []),
                    {
                        submittedAt: new Date().toISOString(),
                        values: responses
                    }
                ];
                responses = {};
                renderSection();
                setStatus("Responses saved. The form is ready for the next response.");
            } catch (error) {
                setStatus(error instanceof Error ? error.message : "Could not save responses.", true);
            } finally {
                save.disabled = false;
            }
        });

        load();
    </script>
</body>
</html>
